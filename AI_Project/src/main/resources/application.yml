server:
  port: 8080

spring:
  application:
    name: ai-tutor-backend

  datasource:
    url: jdbc:mysql://localhost:3306/ai_tutor?createDatabaseIfNotExist=true
    username: root
    password: root      # change to your local MySQL password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.3

ml:
  service:
    base-url: http://localhost:8000
